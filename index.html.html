<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>جهاز POS – انتظار الطباعة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3e;
      --accent:  #f97316;
      --text:    #e8eaf0;
      --muted:   #6b7280;
      --green:   #22c55e;
      --yellow:  #eab308;
    }

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Pulse ring ── */
    .pulse-wrap {
      position: relative;
      width: 90px; height: 90px;
      margin-bottom: 2rem;
    }
    .pulse-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: rgba(249,115,22,.15);
      animation: pulse 2s ease-out infinite;
    }
    .pulse-ring:nth-child(2) { animation-delay: .7s; }
    @keyframes pulse {
      0%   { transform: scale(.7); opacity: .8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .pulse-icon {
      position: absolute; inset: 0;
      background: var(--accent);
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 2rem;
      z-index: 1;
    }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .5rem; text-align: center; }
    .subtitle { font-size: .9rem; color: var(--muted); text-align: center; margin-bottom: 2.5rem; }

    /* ── Status badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .4rem 1rem;
      border-radius: 50px;
      font-size: .8rem;
      font-weight: 600;
      border: 1px solid;
    }
    .badge.waiting  { color: var(--yellow); border-color: #5a4a00; background: #1c1700; }
    .badge.printing { color: var(--green);  border-color: #0a4020; background: #061510; }
    .badge.connected{ color: var(--green);  border-color: #0a4020; background: #061510; }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: currentColor;
    }
    .dot.blink { animation: blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Log ── */
    .log {
      margin-top: 2rem;
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      font-size: .78rem;
      color: var(--muted);
      max-height: 220px;
      overflow-y: auto;
    }
    .log-entry { padding: .25rem 0; border-bottom: 1px solid var(--border); }
    .log-entry:last-child { border: none; }
    .log-entry .time { color: var(--accent); font-size: .7rem; margin-left: .5rem; }

    /* ── Hidden receipt for printing ── */
    #receipt {
      display: none;
    }

    /* ══════════════════════════════════
       PRINT STYLES  –  Thermal 80mm
       ══════════════════════════════════ */
    @media print {
      body > *:not(#receipt) { display: none !important; }

      #receipt {
        display: block !important;
        width: 72mm;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        color: #000;
        background: #fff;
        padding: 4mm;
        direction: rtl;
      }

      .r-header { text-align: center; margin-bottom: 6px; }
      .r-logo   { font-size: 16px; font-weight: bold; }
      .r-sub    { font-size: 10px; }
      .r-divider{ border-top: 1px dashed #000; margin: 5px 0; }
      .r-row    { display: flex; justify-content: space-between; font-size: 11px; margin: 2px 0; }
      .r-label  { color: #444; }
      .r-items-header {
        display: flex; justify-content: space-between;
        font-size: 10px; font-weight: bold;
        border-bottom: 1px solid #000; padding-bottom: 2px; margin-bottom: 4px;
      }
      .r-item {
        display: flex; justify-content: space-between; font-size: 11px; margin: 2px 0;
      }
      .r-item-name { flex: 2; }
      .r-item-qty  { text-align: center; flex: 1; }
      .r-item-price{ text-align: left; flex: 1; }
      .r-total     { font-size: 14px; font-weight: bold; text-align: center; margin: 6px 0; }
      .r-footer    { text-align: center; font-size: 10px; margin-top: 6px; }
      .r-notes     { font-size: 10px; padding: 4px; border: 1px dashed #ccc; margin: 4px 0; }
    }
  </style>
</head>
<body>

  <div class="pulse-wrap">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-icon">🖨️</div>
  </div>

  <h1>جهاز POS</h1>
  <p class="subtitle">هذه الصفحة تنتظر أوامر الطباعة تلقائيًا</p>

  <div id="statusBadge" class="badge waiting">
    <div class="dot blink"></div>
    جاري الاتصال…
  </div>

  <div class="log" id="log">
    <div class="log-entry"><span class="time">--:--</span>بدء تشغيل الصفحة…</div>
  </div>

  <!-- الإيصال المخفي (يُطبع فقط عند الأمر) -->
  <div id="receipt"></div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ══════════════════════════════════════════════
  //  🔧 نفس إعدادات Firebase الخاصة بك هنا أيضاً
  // ══════════════════════════════════════════════
  const firebaseConfig = {
    apiKey:            "REPLACE_WITH_YOUR_API_KEY",
    authDomain:        "REPLACE_WITH_YOUR_AUTH_DOMAIN",
    databaseURL:       "REPLACE_WITH_YOUR_DATABASE_URL",
    projectId:         "REPLACE_WITH_YOUR_PROJECT_ID",
    storageBucket:     "REPLACE_WITH_YOUR_STORAGE_BUCKET",
    messagingSenderId: "REPLACE_WITH_YOUR_MESSAGING_SENDER_ID",
    appId:             "REPLACE_WITH_YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  let lastTimestamp = null;   // نتجاهل أحداث "القيمة الأولى" عند فتح الصفحة

  const badge = document.getElementById('statusBadge');

  // ─── عند الاتصال بنجاح ───
  badge.className   = 'badge connected';
  badge.innerHTML   = '<div class="dot"></div> متصل – ينتظر الطباعة';
  addLog('Firebase متصل ✓');

  // ─── الاستماع لـ print_job ───
  onValue(ref(db, 'print_job'), (snapshot) => {
    const job = snapshot.val();
    if (!job) return;

    // تجاهل البيانات القديمة عند أول تحميل للصفحة
    if (lastTimestamp === null) {
      lastTimestamp = job.timestamp;
      addLog(`بيانات موجودة مسبقاً – تم تجاهلها (#${job.orderNumber})`);
      return;
    }

    // طلب جديد فعلاً؟
    if (job.timestamp === lastTimestamp) return;
    lastTimestamp = job.timestamp;

    addLog(`📦 وصل طلب جديد: ${job.orderNumber} – ${job.customerName}`);
    buildReceipt(job);
    triggerPrint();
  });

  // ─── بناء الإيصال ───
  function buildReceipt(j) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-SA');
    const dateStr = now.toLocaleDateString('ar-SA');

    const itemsHTML = (j.items || []).map(i => `
      <div class="r-item">
        <span class="r-item-name">${i.name}</span>
        <span class="r-item-qty">${i.qty}</span>
        <span class="r-item-price">${(i.subtotal||0).toFixed(2)}</span>
      </div>`).join('');

    const notesHTML = j.notes
      ? `<div class="r-divider"></div><div class="r-notes">📝 ${j.notes}</div>`
      : '';

    document.getElementById('receipt').innerHTML = `
      <div class="r-header">
        <div class="r-logo">${j.restaurantName || 'المطعم'}</div>
        <div class="r-sub">إيصال طلب</div>
      </div>

      <div class="r-divider"></div>

      <div class="r-row"><span class="r-label">رقم الطلب</span><span>${j.orderNumber}</span></div>
      <div class="r-row"><span class="r-label">العميل</span><span>${j.customerName}</span></div>
      <div class="r-row"><span class="r-label">المندوب</span><span>${j.driverName || '—'}</span></div>
      <div class="r-row"><span class="r-label">نوع الطلب</span><span>${j.orderType}</span></div>
      <div class="r-row"><span class="r-label">التاريخ</span><span>${dateStr}</span></div>
      <div class="r-row"><span class="r-label">الوقت</span><span>${timeStr}</span></div>

      <div class="r-divider"></div>

      <div class="r-items-header">
        <span>الصنف</span><span>الكمية</span><span>السعر</span>
      </div>
      ${itemsHTML}

      <div class="r-divider"></div>
      <div class="r-total">المجموع: ${(j.total||0).toFixed(2)} ر.س</div>
      <div class="r-divider"></div>

      ${notesHTML}

      <div class="r-footer">شكراً لزيارتكم 🙏<br/>يُرجى الاحتفاظ بالإيصال</div>
    `;
  }

  // ─── تشغيل الطباعة التلقائية ───
  function triggerPrint() {
    badge.className = 'badge printing';
    badge.innerHTML = '<div class="dot blink"></div> جاري الطباعة…';
    addLog('🖨️ بدء الطباعة التلقائية…');

    /*
      window.print() يعمل في:
        ✅ متصفح Chrome / WebView على Android بدون رسالة تأكيد
           إذا كان الـ WebView يُشغّل الصفحة كـ kiosk / trusted app.
        ⚠️  إذا ظهر dialog للطابعة: اضبط الطابعة الحرارية كطابعة افتراضية
            في Android وفعّل Auto-confirm في إعدادات Chrome/WebView.

        إذا أردت Native Bridge بدلاً من window.print():
        استبدل السطر أدناه بـ: Android.print(receiptHTML);
        (بعد إضافة JavascriptInterface في الكود الأصلي)
    */
    setTimeout(() => {
      window.print();

      setTimeout(() => {
        badge.className = 'badge connected';
        badge.innerHTML = '<div class="dot"></div> متصل – ينتظر الطباعة';
        addLog('✅ تمت الطباعة بنجاح');
      }, 2000);
    }, 300);
  }

  // ─── سجل الأحداث ───
  function addLog(msg) {
    const logEl = document.getElementById('log');
    const t = new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="time">${t}</span>${msg}`;
    logEl.prepend(entry);
    if (logEl.children.length > 20) logEl.lastElementChild.remove();
  }
</script>
</body>
</html>
